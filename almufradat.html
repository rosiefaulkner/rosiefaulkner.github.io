<!DOCTYPE html>

<head>

  <!-- Google Fonts: Noto Naskh Arabic, IBM Plex Sans Arabic, Scheherazade New for ultra-legible Arabic, Plus Jakarta Sans for English UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sand: {
              50: '#FCFBF7',
              100: '#F7F2E7',
              200: '#EFE5D1',
              300: '#E2D1B3',
            },
            levant: {
              teal: '#0F4C5C',
              tealLight: '#1B6B7D',
              tealDark: '#09323D',
              terracotta: '#C85A32',
              terracottaLight: '#E07A5F',
              gold: '#D4A359',
              olive: '#2A7B6F',
              slate: '#1E293B'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            arabic: ['"Noto Naskh Arabic"', '"IBM Plex Sans Arabic"', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --arabic-font: 'Noto Naskh Arabic', 'IBM Plex Sans Arabic', serif;
      --arabic-base-scale: 1.12;
      --arabic-user-zoom: 1.0;
    }

    body.arabic-mode-naskh {
      --arabic-font: 'Noto Naskh Arabic', serif;
      --arabic-base-scale: 1.14;
    }

    body.arabic-mode-modern {
      --arabic-font: 'IBM Plex Sans Arabic', sans-serif;
      --arabic-base-scale: 1.05;
    }

    body.arabic-mode-classic {
      --arabic-font: 'Scheherazade New', 'Noto Naskh Arabic', serif;
      --arabic-base-scale: 1.28;
    }

    body {
      background-color: #F7F2E7;
      color: #1E293B;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    .font-arabic {
      font-family: var(--arabic-font);
      line-height: 1.9;
      letter-spacing: 0px;
      word-spacing: 3px;
      padding-top: 0.12em;
      padding-bottom: 0.12em;
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .arabic-tile-text {
      font-size: calc(1.5rem * var(--arabic-base-scale) * var(--arabic-user-zoom));
    }

    .arabic-hero-text {
      font-size: calc(2.25rem * var(--arabic-base-scale) * var(--arabic-user-zoom));
    }

    @media (min-width: 640px) {
      .arabic-tile-text {
        font-size: calc(1.7rem * var(--arabic-base-scale) * var(--arabic-user-zoom));
      }
      .arabic-hero-text {
        font-size: calc(2.9rem * var(--arabic-base-scale) * var(--arabic-user-zoom));
      }
    }

    @keyframes pulseSpeaker {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(200, 90, 50, 0.6); }
      50% { transform: scale(1.14); box-shadow: 0 0 0 8px rgba(200, 90, 50, 0); }
    }
    .speaker-playing {
      animation: pulseSpeaker 0.75s infinite ease-in-out;
      background-color: #C85A32 !important;
      color: #FFFFFF !important;
      border-color: #C85A32 !important;
    }

    /* Subtle Levantine Geometric Header Pattern */
    .levant-pattern {
      background-color: #0F4C5C;
      background-image: radial-gradient(rgba(212, 163, 89, 0.16) 1.5px, transparent 1.5px),
                        radial-gradient(rgba(212, 163, 89, 0.12) 1.5px, #0F4C5C 1.5px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
    }

    /* 3D Flashcard Flip Styles */
    .perspective-1000 {
      perspective: 1200px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Tile Animations */
    @keyframes popIn {
      0% { transform: scale(0.94); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes matchPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); background-color: #D1FAE5; border-color: #10B981; }
      100% { transform: scale(0.96); opacity: 0.32; }
    }

    .animate-pop {
      animation: popIn 0.22s ease-out forwards;
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }
    .tile-matched {
      animation: matchPulse 0.42s ease-out forwards;
      pointer-events: none;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F2E7;
    }
    ::-webkit-scrollbar-thumb {
      background: #C9B99B;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #0F4C5C;
    }
  </style>
</head>
<body class="arabic-mode-naskh min-h-screen flex flex-col justify-between selection:bg-levant-terracotta selection:text-white">
